name: CD - Publish Container Image

on:
  workflow_run:
    workflows: ["CI - Default Prediction API"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  MIN_F1: "0.75"
  MIN_ROC_AUC: "0.75"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tarea-mlops

jobs:
  build-and-push:
    name: Entrenar modelo de release y publicar imagen
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Obtener código validado por CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Entrenar modelo de release
        run: python training/train.py

      - name: Validar quality gate
        run: |
          python training/evaluate.py \
            --min-f1 "${MIN_F1}" \
            --min-roc-auc "${MIN_ROC_AUC}"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar tags y metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max