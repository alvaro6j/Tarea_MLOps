name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar Ruff
        run: python -m ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build --tag default-prediction-api:ci .

  smoke:
    name: Smoke test Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Levantar servicio
        run: docker compose up -d --build

      - name: Esperar health check
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 3
          done
          echo "La API no respondió correctamente."
          exit 1

      - name: Probar predicción real
        run: |
          curl --fail --silent --show-error \
            --request POST http://localhost:8000/predict \
            --header "Content-Type: application/json" \
            --data '{
              "Edad": 34,
              "Nivel_Educacional": "SupInc",
              "Años_Trabajando": 11,
              "Ingresos": 68,
              "Deuda_Comercial": 11.9,
              "Deuda_Credito": 3.37,
              "Otras_Deudas": 4.73
            }'

      - name: Detener servicio
        if: always()
        run: docker compose down --volumes --remove-orphans