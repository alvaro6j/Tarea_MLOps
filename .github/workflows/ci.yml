name: CI - Default Prediction API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  MIN_F1: "0.75"
  MIN_ROC_AUC: "0.75"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar Ruff
        run: python -m ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        run: python -m pytest --cov-report=xml

      - name: Subir reporte de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  train-and-gate:
    name: Entrenar y validar modelo
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Entrenar modelo
        run: python training/train.py

      - name: Ejecutar quality gate
        run: |
          python training/evaluate.py \
            --min-f1 "${MIN_F1}" \
            --min-roc-auc "${MIN_ROC_AUC}"

      - name: Subir artefactos del modelo
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/
          retention-days: 30

  docker-build:
    name: Build Docker y smoke test
    needs: train-and-gate
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Descargar modelo validado
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Levantar servicio desde imagen
        run: docker compose up -d --build

      - name: Esperar health check
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 3
          done
          echo "La API no respondió correctamente."
          exit 1

      - name: Probar predicción real
        run: |
          curl --fail --silent --show-error \
            --request POST http://localhost:8000/predict \
            --header "Content-Type: application/json" \
            --data '{
              "Edad": 34,
              "Nivel_Educacional": "SupInc",
              "Años_Trabajando": 11,
              "Ingresos": 68,
              "Deuda_Comercial": 11.9,
              "Deuda_Credito": 3.37,
              "Otras_Deudas": 4.73
            }'

      - name: Detener servicio
        if: always()
        run: docker compose down --volumes --remove-orphans